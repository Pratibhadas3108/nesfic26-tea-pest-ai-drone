<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circular badge -->
  <circle cx="32" cy="32" r="30" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  
  <!-- Subtle radar grid lines -->
  <circle cx="32" cy="32" r="22" stroke="#064e3b" stroke-width="1" stroke-dasharray="2 3"/>
  <circle cx="32" cy="32" r="14" stroke="#064e3b" stroke-width="1" stroke-dasharray="2 3"/>
  
  <!-- Tea Leaf Shape -->
  <path d="M32 12C21 16 16 28 22 41C25 47 31 50 32 50C33 50 39 47 42 41C48 28 43 16 32 12Z" fill="url(#leaf-grad)" />
  <path d="M32 16V46" stroke="#064e3b" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M32 25C35 23 38 24 39 26" stroke="#064e3b" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M32 32C29 30 26 31 25 33" stroke="#064e3b" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M32 39C35 37 37 38 38 40" stroke="#064e3b" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Drone / Crosshair Wings -->
  <!-- Top Left Rotor -->
  <circle cx="18" cy="18" r="4.5" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="1.5"/>
  <line x1="21" y1="21" x2="27" y2="27" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  <!-- Top Right Rotor -->
  <circle cx="46" cy="18" r="4.5" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="1.5"/>
  <line x1="43" y1="21" x2="37" y2="27" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  <!-- Bottom Left Rotor -->
  <circle cx="18" cy="46" r="4.5" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="1.5"/>
  <line x1="21" y1="43" x2="27" y2="37" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  <!-- Bottom Right Rotor -->
  <circle cx="46" cy="46" r="4.5" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="1.5"/>
  <line x1="43" y1="43" x2="37" y2="37" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>

  <!-- Center Crosshair Target Pulse -->
  <circle cx="32" cy="32" r="3.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Gradients -->
  <defs>
    <linearGradient id="leaf-grad" x1="20" y1="12" x2="44" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
</svg>
